<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login / Register</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Segoe UI", sans-serif;

        background:
          linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.15)),
          url("/static/images/Waves.jpg") no-repeat center/cover;

        overflow: hidden;
        animation: bgMove 20s ease-in-out infinite alternate;
      }

      @keyframes bgMove {
        0% {
          background-position: center top;
        }

        100% {
          background-position: center bottom;
        }
      }

  

      .auth-card {
        width: 420px;

        padding: 45px;

        border-radius: 28px;

        background: rgba(255, 255, 255, 0.12);

        backdrop-filter: blur(16px);

        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);

        animation: floatCard 4s ease-in-out infinite;
      }


      @keyframes floatCard {
        0% {
          transform: translateY(0px);
        }

        50% {
          transform: translateY(-10px);
        }

        100% {
          transform: translateY(0px);
        }
      }

     

      .logo {
        font-size: 40px;
        text-align: center;
        margin-bottom: 10px;
      }

      
      .heading {
        color: white;
        text-align: center;
        font-weight: 700;
        margin-bottom: 5px;
      }

      .subtext {
        text-align: center;
        color: rgba(255, 255, 255, 0.8);
        margin-bottom: 30px;
      }



      .form-control {
        height: 30px;
        border: none;
        border-radius: 14px;
        margin-bottom: 18px;
        background: rgba(255, 255, 255, 0.85);
      }

      .form-control:focus {
        border-color: #00bfa6;
        box-shadow: 0 0 10px rgba(0, 191, 166, 0.3);
      }

      

      .btn-custom {
        width: 100%;

        height: 52px;

        border: none;

        border-radius: 30px;

        background: #00bfa6;

        color: white;

        font-weight: 600;

        transition: 0.3s;

        box-shadow: 0 10px 25px rgba(0, 191, 166, 0.35);
      }

      .btn-custom:hover {
        background: #00a58f;
        transform: translateY(-2px);
      }

    
      .switch-text {
        text-align: center;
        margin-top: 20px;
        color: white;
      }

      .switch {
        color: #00e0c2;
        cursor: pointer;
        font-weight: 600;
      }

     

      .back-btn {
        position: fixed;
        left: 20px;
        bottom: 20px;

        background: #00bfa6;
        color: white;

        text-decoration: none;

        padding: 10px 18px;

        border-radius: 30px;

        font-weight: 600;

        box-shadow: 0 10px 25px rgba(0, 191, 166, 0.3);

        transition: 0.3s;
      }

      .back-btn:hover {
        background: #00a58f;
        color: white;
        transform: scale(1.05);
      }


      @media (max-width: 500px) {
        .auth-card {
          width: 90%;
          padding: 30px;
        }
      }
    </style>
  </head>

  <body>
    <div class="auth-card">
      <div class="logo"></div>

      <h2 class="heading" id="formTitle">Welcome Back</h2>

      <p class="subtext">Save & Explore More</p>

      <!-- LOGIN -->

      <div id="loginForm">
        <form action="/login" method="POST">
          <input
            type="text"
            name="identifier"
            class="form-control"
            placeholder="Email or Phone"
            required
          />

          <input
            type="password"
            name="password"
            class="form-control"
            placeholder="Password"
            required
          />

          <button class="btn btn-custom">Login</button>
        </form>

        <p class="switch-text">
          Don't have an account?
          <span class="switch" onclick="showRegister()"> Sign up </span>
        </p>
      </div>

      <!-- REGISTER -->

      <div id="registerForm" style="display: none">
        <form action="/register" method="POST">
          <input
            type="text"
            name="name"
            class="form-control"
            placeholder="Full Name"
            required
          />

          <input
            type="email"
            name="email"
            class="form-control"
            placeholder="Email"
            required
          />

          <input
            type="text"
            name="phone"
            class="form-control"
            placeholder="Phone Number"
            required
          />

          <input
            type="password"
            name="password"
            class="form-control"
            placeholder="Password"
            required
          />

          <button class="btn btn-custom">Create Account</button>
        </form>

        <p class="switch-text">
          Already have an account?
          <span class="switch" onclick="showLogin()"> Login </span>
        </p>
      </div>
    </div>

  

    <a href="/" class="back-btn"> ← Back </a>

    <script>
      const loginForm = document.getElementById("loginForm");
      const registerForm = document.getElementById("registerForm");
      const formTitle = document.getElementById("formTitle");

      function showRegister() {
        loginForm.style.display = "none";

        registerForm.style.display = "block";

        formTitle.innerText = "Create Account";
      }

      function showLogin() {
        registerForm.style.display = "none";

        loginForm.style.display = "block";

        formTitle.innerText = "Welcome Back";
      }
    </script>
  </body>
</html>
